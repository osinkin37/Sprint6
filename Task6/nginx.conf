http {
    # Создаем зону для ограничения запросов от партнеров - 10 в минуту
    limit_req_zone $binary_remote_addr zone=limit_zone:10m rate=10r/m;

    upstream backend_servers {
        server backend1.example.com;
        server backend2.example.com;
        server backend3.example.com;
    }

    server {
        listen 80;

        # Применяем ограничение запросов для партнеров
        location / {
            limit_req zone=limit_zone burst=5 nodelay;
            limit_req_status 429;  # Возвращаем HTTP 429 при превышении лимита запросов

            proxy_pass http://backend_servers;
        }
    }
}